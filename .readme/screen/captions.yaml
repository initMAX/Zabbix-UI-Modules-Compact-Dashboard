00-without-module.png:
  cs: 'Standardní Zabbix: mezera kolem každého widgetu.'
  en: 'Standard Zabbix: a gap around every widget.'
01-overview.png:
  cs: 'S Compact dashboard: stejný dashboard, dlaždice těsně u sebe, víc obsahu na obrazovce.'
  en: 'With Compact dashboard: the same board, tiles flush against each other, more of it visible.'
widget.png:
  cs: Kompletní monitorovací dashboard s kompaktním rozmístěním widgetů od okraje k okraji.
  en: A full monitoring dashboard with dense, edge-to-edge widget placement.
02-edit-mode.png:
  cs: 'Režim úprav: stejná hustá mřížka, widgety se přesouvají a nastavují jako obvykle.'
  en: 'Edit mode: the same dense grid, widgets move and configure exactly as usual.'
